<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Information</title>

    <!-- Bootstrap CSS for styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* Global body styles */
        body {
            font-family: 'Merriweather', serif;
            background-color: #f8f9fa;
        }

        /* Container styling to center content */
        .container {
            max-width: 90%;
            margin-top: 50px;
        }

        /* Card styling for user info display */
        .card {
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            background: white;
            padding: 30px;
        }

        /* Heading styles */
        h2 {
            font-weight: 700;
            color: #343a40;
        }

        /* Button styling */
        .btn {
            font-weight: 600;
        }
    </style>
</head>
<body>

<!-- Main container for user information -->
<div class="container">
    <div class="card">
        <!-- Header section with title and logout button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>User Information</h2>

            <!-- Logout form (Thymeleaf-powered) -->
            <form th:action="@{/logout}" method="post">

                <button type="submit" class="btn btn-danger">Logout</button>
            </form>

        </div>

        <!-- Display user details dynamically using Thymeleaf -->
        <p><strong>Name:</strong> <span th:text="${userName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${userEmail}"></span></p>

        <!-- Button to navigate to contacts page -->
        <a href="/contacts" class="btn btn-primary mt-4">View Contacts</a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Contacts</title>

  <!-- Bootstrap CSS for styling -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Bootstrap and jQuery scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
        /* General body styling */
        body {
            font-family: 'Merriweather', serif;
            background-color: #f8f9fa;
        }

        /* Container styling */
        .container {
            max-width: 90%;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        /* Header styling */
        h2 {
            font-weight: bold;
            color: #343a40;
        }

        /* Button styling */
        .btn-primary, .btn-secondary {
            font-weight: bold;
        }

        /* Table cell alignment */
        .table th, .table td {
            text-align: center;
            vertical-align: middle;
        }

        /* Modal content styling */
        .modal-content {
            border-radius: 8px;
        }
  </style>

  <script>
      // Variable to store the contact resource name to be deleted
      let deleteResourceName = "";

      // Function to show the delete confirmation modal
      function showDeleteModal(resourceName) {
          deleteResourceName = resourceName;
          let deleteModal = new bootstrap.Modal(document.getElementById("deleteModal"));
          deleteModal.show();
      }

      // Function to submit the deletion request
      function deleteContact() {
          // Create a form dynamically for deletion
          let form = document.createElement("form");
          form.method = "POST";
          form.action = "/api/contacts/delete";

          // Add a hidden input field to pass the contact's resource name
          let input = document.createElement("input");
          input.type = "hidden";
          input.name = "resourceName";
          input.value = deleteResourceName;
          form.appendChild(input);

          // Append form to body and submit
          document.body.appendChild(form);
          form.submit();
      }
  </script>
</head>
<body>

<div class="container mt-5">
  <h2 class="text-center mb-4">My Contacts</h2>

  <!-- Navigation buttons -->
  <div class="d-flex justify-content-between mb-4">
    <a href="/user-info" class="btn btn-secondary">Back to Profile</a>
    <a href="/addcontact" class="btn btn-primary">Add New Contact</a>
  </div>

  <!-- Display error message if there's any -->
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <!-- Display success message if there's any -->
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

  <!-- Table displaying the list of contacts -->
  <table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- Loop through contacts list -->
    <tr th:each="contact : ${contacts}" th:attr="data-resource-name=${contact.resourceName}">
      <!-- Display contact name -->
      <td th:text="${contact.names[0].displayName}"></td>

      <!-- Display email, or 'N/A' if no email is available -->
      <td th:text="${contact.emailAddresses != null ? contact.emailAddresses[0].value : 'N/A'}"></td>

      <!-- Display phone number, or 'N/A' if no phone number is available -->
      <td th:text="${contact.phoneNumbers != null ? contact.phoneNumbers[0].value : 'N/A'}"></td>

      <!-- Action buttons (Edit and Delete) -->
      <td>
        <!-- Edit button redirects to edit contact page -->
        <a th:href="@{/editcontact(resourceName=${contact.resourceName})}" class="btn btn-warning btn-sm">Edit</a>

        <!-- Delete button triggers delete confirmation modal -->
        <button type="button" class="btn btn-danger btn-sm" th:attr="onclick=|showDeleteModal('${contact.resourceName}')|">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <p class="mb-3">Are you sure you want to delete this contact?</p>
      </div>
      <div class="modal-footer">
        <!-- Cancel button closes the modal -->
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

        <!-- Confirm button triggers the delete function -->
        <button type="button" class="btn btn-danger" onclick="deleteContact()">Confirm</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>

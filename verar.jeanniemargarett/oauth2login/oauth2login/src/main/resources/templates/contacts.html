<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2 class="text-center mb-4">My Contacts</h2>

  <div class="d-flex justify-content-between mb-3">
    <a href="/user-info" class="btn btn-secondary">⬅️ Back to Profile</a>
    <a href="/addcontact" class="btn btn-primary">➕ Add New Contact</a>
  </div>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

  <table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="contact : ${contacts}">
      <td th:text="${contact.names[0].displayName}"></td>
      <td th:text="${contact.emailAddresses != null ? contact.emailAddresses[0].value : 'N/A'}"></td>
      <td th:text="${contact.phoneNumbers != null ? contact.phoneNumbers[0].value : 'N/A'}"></td>
      <td>
        <a th:href="@{/editcontact(resourceName=${contact.resourceName})}" class="btn btn-warning btn-sm">✏️ Edit</a>
        <form action="/api/contacts/delete" method="post" class="d-inline">
          <input type="hidden" name="resourceName" th:value="${contact.resourceName}">
          <button type="submit" class="btn btn-danger btn-sm">🗑️ Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
